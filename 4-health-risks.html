<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>肥胖健康風險</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Inter:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#3F3D56;--body:#5E5873;--muted:#718096;--line:#E2E8F0;--orange:#EB901D;--orange-deep:#BB7217;--cream:#FFFAF0;--peach:#FEEBC8;
  --pad-x:clamp(16px,5vw,24px);--pad-y:clamp(40px,8vw,72px)}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:#FFFFFF}
body{font-family:'Noto Sans TC',-apple-system,BlinkMacSystemFont,'PingFang TC','Microsoft JhengHei',sans-serif;color:var(--body);line-height:1.7;-webkit-text-size-adjust:100%}
img,svg{max-width:100%}
.wrap{max-width:1200px;margin:0 auto;padding:var(--pad-y) var(--pad-x)}
.num{font-family:'Inter','Noto Sans TC',sans-serif;font-variant-numeric:tabular-nums}
.sec-head{display:flex;align-items:center;gap:clamp(12px,3vw,20px)}
.q-badge{width:clamp(52px,12vw,72px);height:clamp(52px,12vw,72px);border-radius:50%;background:var(--peach);color:var(--ink);font-size:clamp(20px,5vw,28px);font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sec-title{margin:0;font-size:clamp(20px,5.2vw,34px);line-height:1.35;color:var(--ink);font-weight:700}
.lead{margin:0;font-size:clamp(15px,3.8vw,17px);max-width:48em}
:focus-visible{outline:3px solid #3E8CF0;outline-offset:2px}
.wrap{display:flex;flex-direction:column;gap:clamp(20px,4.5vw,36px)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:clamp(12px,3vw,20px)}
.risk{border:1px solid var(--line);border-radius:18px;padding:clamp(18px,4.5vw,28px);display:flex;gap:clamp(14px,3.5vw,18px);align-items:flex-start}
.risk .ic{width:48px;height:48px;border-radius:12px;background:var(--cream);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.risk h3{margin:0 0 4px;font-size:clamp(17px,4.4vw,19px);color:var(--ink)}
.risk p{margin:0;font-size:15px}
@media (min-width:1000px){ .grid{grid-template-columns:repeat(3,minmax(0,1fr))} }
</style>
</head>
<body data-module="health-risks">
<section id="risk">
<div class="wrap">
  <div class="sec-head">
    <span class="q-badge">Q2</span>
    <h2 class="sec-title">肥胖會帶來哪些健康風險？</h2>
  </div>
  <p class="lead">過多的脂肪，特別是堆積在腹部的內臟脂肪，會影響全身代謝，與多種慢性疾病密切相關。</p>
  <div class="grid">
  <div class="risk">
    <span class="ic"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#BB7217" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.7s6 6.3 6 11.3a6 6 0 0 1-12 0c0-5 6-11.3 6-11.3z"/></svg></span>
    <div><h3>第 2 型糖尿病</h3><p>脂肪組織增加會降低胰島素敏感度，使血糖更難控制。</p></div>
  </div>
  <div class="risk">
    <span class="ic"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#BB7217" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21.2l8.8-8.8a5.5 5.5 0 0 0 0-7.8z"/></svg></span>
    <div><h3>高血壓與心血管疾病</h3><p>心臟負擔加重，血壓、血脂異常的機會也隨之提高。</p></div>
  </div>
  <div class="risk">
    <span class="ic"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#BB7217" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12c0-4.4 3.6-8 8-8h6v6c0 5.5-4.5 10-10 10H4z"/><path d="M9 15l5-5"/></svg></span>
    <div><h3>脂肪肝</h3><p>肝臟堆積脂肪常沒有症狀，長期可能進展為肝炎或肝纖維化。</p></div>
  </div>
  <div class="risk">
    <span class="ic"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#BB7217" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></span>
    <div><h3>睡眠呼吸中止症</h3><p>頸部與上呼吸道脂肪增加，容易打鼾、睡不好、白天疲倦。</p></div>
  </div>
  <div class="risk">
    <span class="ic"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#BB7217" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v7l-2 11"/><path d="M16 3v7l2 11"/><path d="M8 10h8"/></svg></span>
    <div><h3>退化性關節炎</h3><p>膝蓋與髖關節長期承重過多，加速磨損與疼痛。</p></div>
  </div>
  <div class="risk">
    <span class="ic"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#BB7217" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span>
    <div><h3>荷爾蒙與生育</h3><p>肥胖可能影響荷爾蒙平衡，與月經不規則、多囊性卵巢症候群有關。</p></div>
  </div>
  </div>
</div>
</section>
<script>
/* 嵌在 iframe 時，自動回報高度給外層頁面，避免出現捲軸；單獨開啟時不影響 */
(function(){
  if (window.parent === window) return;
  function send(){ window.parent.postMessage({ type: 'bmi-module-height', id: document.body.dataset.module, height: document.documentElement.scrollHeight }, '*'); }
  window.addEventListener('load', send);
  window.addEventListener('resize', send);
  if (window.ResizeObserver) new ResizeObserver(send).observe(document.body);
})();
</script>
</body>
</html>
