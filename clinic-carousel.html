<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>初日診所 院所介紹輪播</title>
<style>
  :root {
    --bg: #FEF6F0;
    --accent: #F37934;
    --text: #333333;
    --sub: #4D4D4D;
    --card-bg: #FFFFFF;
    --border: #C9CDD3;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
    color: var(--text);
  }
  .page {
    width: 100%;
    max-width: 420px;
    margin: 0 auto;
    padding: 20px 14px 28px;
  }
  .carousel {
    position: relative;
  }
  .viewport {
    overflow: hidden;
    border-radius: 16px;
  }
  .track {
    display: flex;
    transition: transform 0.45s ease;
  }
  .slide {
    flex: 0 0 100%;
    width: 100%;
    max-width: 100%;
    flex-shrink: 0;
    padding: 0 2px;
  }
  .card {
    background: var(--card-bg);
    border: 1.5px dashed var(--border);
    border-radius: 14px;
    padding: 18px 16px 20px;
    text-align: center;
    box-shadow: 0 6px 24px rgba(0,0,0,0.06);
  }
  .clinic-name {
    margin: 2px 0 14px;
    font-size: 20px;
    font-weight: 700;
    color: var(--text);
  }
  .photo-wrap {
    width: 100%;
    aspect-ratio: 4 / 3;
    border-radius: 10px;
    overflow: hidden;
    background: #f0f0f0;
  }
  .photo-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .address {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    margin-top: 14px;
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 15px;
    color: var(--accent);
    text-decoration: underline;
    text-decoration-color: rgba(243,121,52,0.5);
    text-underline-offset: 3px;
    background: rgba(243,121,52,0.08);
    transition: background 0.2s, text-decoration-color 0.2s;
  }
  .address:hover {
    background: rgba(243,121,52,0.16);
    text-decoration-color: var(--accent);
  }
  .address .map-hint {
    font-size: 13px;
    font-weight: 600;
    opacity: 0.85;
    white-space: nowrap;
  }
  .note {
    margin: 16px 0 0;
    font-size: 13px;
    font-weight: 700;
    color: var(--sub);
    line-height: 1.6;
    text-align: center;
  }
  .nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,0.9);
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    color: var(--accent);
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .nav:hover { background: #ffffff; }
  .nav.prev { left: -4px; }
  .nav.next { right: -4px; }
  .dots {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-top: 14px;
  }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #E0C9BB;
    border: none;
    cursor: pointer;
    padding: 0;
  }
  .dot.active {
    background: var(--accent);
    width: 20px;
    border-radius: 4px;
  }

  /* 電腦板：四家並排列出，不用輪播 */
  @media (min-width: 800px) {
    .page { max-width: 1100px; padding: 32px 24px 40px; }
    .viewport { overflow: visible; border-radius: 0; }
    .track {
      display: grid;
      grid-template-columns: repeat(var(--slide-count, 4), 1fr);
      gap: 20px;
      transform: none !important;
      transition: none;
    }
    .slide { padding: 0; }
    .slide .card { height: 100%; display: flex; flex-direction: column; }
    .nav { display: none; }
    .dots { display: none; }
  }
</style>
</head>
<body>
<div class="page">
  <div class="carousel" id="carousel">
    <div class="viewport">
      <div class="track" id="track"></div>
    </div>
    <button class="nav prev" id="prevBtn" aria-label="上一家">‹</button>
    <button class="nav next" id="nextBtn" aria-label="下一家">›</button>
  </div>
  <div class="dots" id="dots"></div>
  <p class="note">台北初日每月有名額開放限制，會依報名時間順序，陸續為您安排量測時間。</p>
</div>

const track = document.getElementById('track');
const dotsEl = document.getElementById('dots');
let current = 0;
let autoTimer = null;
const AUTO_MS = 5000;

function render() {
  track.innerHTML = clinics.map(c => `
    <div class="slide">
      <div class="card">
        <h2 class="clinic-name">${c.name}</h2>
        <div class="photo-wrap"><img src="${c.photo}" alt="${c.name}" loading="lazy"></div>
        <a class="address" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(c.address)}" target="_blank" rel="noopener"><span>📍 ${c.address}</span><span class="map-hint">地圖 ›</span></a>

      </div>
    </div>
  `).join('');

  dotsEl.innerHTML = clinics.map((c, i) => `<button class="dot" data-i="${i}" aria-label="${c.name}"></button>`).join('');
}

function goTo(i, userTriggered) {
  current = (i + clinics.length) % clinics.length;
  track.style.transform = `translateX(-${current * 100}%)`;
  [...dotsEl.children].forEach((d, idx) => d.classList.toggle('active', idx === current));
  if (userTriggered) restartAuto();
}

function next(userTriggered) { goTo(current + 1, userTriggered); }
function prev(userTriggered) { goTo(current - 1, userTriggered); }

function startAuto() {
  autoTimer = setInterval(() => next(false), AUTO_MS);
}
function isDesktop() {
  return window.matchMedia('(min-width: 800px)').matches;
}
function restartAuto() {
  clearInterval(autoTimer);
  if (!isDesktop()) startAuto();
}
function updateAutoplay() {
  clearInterval(autoTimer);
  if (!isDesktop()) startAuto();
}

render();
track.style.setProperty('--slide-count', clinics.length);
goTo(0, false);
updateAutoplay();
window.addEventListener('resize', updateAutoplay);

document.getElementById('nextBtn').addEventListener('click', () => next(true));
document.getElementById('prevBtn').addEventListener('click', () => prev(true));
dotsEl.addEventListener('click', (e) => {
  const btn = e.target.closest('.dot');
  if (btn) goTo(parseInt(btn.dataset.i, 10), true);
});

const carouselEl = document.getElementById('carousel');
carouselEl.addEventListener('mouseenter', () => clearInterval(autoTimer));
carouselEl.addEventListener('mouseleave', () => updateAutoplay());
</script>
