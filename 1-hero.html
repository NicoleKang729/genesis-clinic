<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>主視覺</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Inter:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#3F3D56;--body:#5E5873;--muted:#718096;--line:#E2E8F0;--orange:#EB901D;--orange-deep:#BB7217;--cream:#FFFAF0;--peach:#FEEBC8;
  --pad-x:clamp(16px,5vw,24px);--pad-y:clamp(40px,8vw,72px)}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:transparent}
body{font-family:'Noto Sans TC',-apple-system,BlinkMacSystemFont,'PingFang TC','Microsoft JhengHei',sans-serif;color:var(--body);line-height:1.7;-webkit-text-size-adjust:100%}
img,svg{max-width:100%}
.wrap{max-width:1200px;margin:0 auto;padding:var(--pad-y) var(--pad-x)}
.num{font-family:'Inter','Noto Sans TC',sans-serif;font-variant-numeric:tabular-nums}
.sec-head{display:flex;align-items:center;gap:clamp(12px,3vw,20px)}
.q-badge{width:clamp(52px,12vw,72px);height:clamp(52px,12vw,72px);border-radius:50%;background:var(--peach);color:var(--ink);font-size:clamp(20px,5vw,28px);font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sec-title{margin:0;font-size:clamp(20px,5.2vw,34px);line-height:1.35;color:var(--ink);font-weight:700}
.lead{margin:0;font-size:clamp(15px,3.8vw,17px);max-width:48em}
:focus-visible{outline:3px solid #3E8CF0;outline-offset:2px}
.hero{background:transparent}
.hero .wrap{display:grid;grid-template-columns:1fr;gap:clamp(28px,6vw,56px);align-items:center;padding-top:clamp(48px,10vw,96px);padding-bottom:clamp(48px,10vw,96px)}
.hero-text{display:flex;flex-direction:column;gap:clamp(16px,3.5vw,24px);min-width:0}
.eyebrow{margin:0;font-size:clamp(13px,3.4vw,15px);font-weight:700;color:var(--ink);letter-spacing:.12em}
.hero h1{margin:0;font-size:clamp(30px,7.6vw,52px);line-height:1.25;font-weight:900;color:var(--ink)}
.hero-sub{margin:0;font-size:clamp(15px,4vw,18px);max-width:34em}
.actions{display:flex;flex-wrap:wrap;gap:12px}
.btn{font-family:inherit;font-weight:700;line-height:1;border-radius:8px;border:2px solid transparent;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;text-decoration:none;transition:background .15s,color .15s;min-height:48px;padding:0 24px;font-size:16px}
.btn-solid{background:#C46F0B;color:#FFFFFF}.btn-solid:hover{background:#A85E08;color:#FFFFFF}
.btn-outline{background:transparent;color:var(--orange-deep);border-color:var(--orange)}.btn-outline:hover{background:#FEF3E2}
.scale{background:#FFFFFF;border-radius:24px;padding:clamp(22px,5vw,36px);border:1px solid var(--line);box-shadow:0 2px 6px rgba(0,0,0,.04);display:flex;flex-direction:column;gap:20px;min-width:0}
.scale-title{margin:0;font-size:15px;font-weight:700;color:var(--ink)}
.bar{display:flex;height:20px;border-radius:100px;overflow:hidden}
.bar span{display:block}
.legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.legend div{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.legend i{width:12px;height:12px;border-radius:3px;margin-top:7px;flex-shrink:0}
.legend strong{color:var(--ink)}
.formula{margin:0;font-size:13px;color:var(--muted)}
@media (max-width:480px){
  .actions .btn{flex:1 1 100%}
  .legend div{font-size:14px}
}
@media (min-width:900px){
  .hero .wrap{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
}
</style>
</head>
<body data-module="hero">
<section class="hero" id="top">
<div class="wrap">
  <div class="hero-text">
    <p class="eyebrow">體重管理衛教專題</p>
    <h1>減重不只是外表，<br>是代謝健康的起點</h1>
    <p class="hero-sub">肥胖已被視為一種需要長期管理的慢性疾病。了解自己的體位、認識潛在風險，再和專業醫師一起擬定適合你的計畫。</p>
    <div class="actions">
      <a class="btn btn-solid" href="YOUR_BOOKING_URL" target="_top">預約減重諮詢</a>
      <a class="btn btn-outline" href="YOUR_BMI_PAGE_URL" target="_top">測測我的 BMI</a>
    </div>
  </div>
  <div class="scale">
    <p class="scale-title">成人 BMI 分級（國健署標準）</p>
    <div class="bar" aria-hidden="true">
      <span style="flex:18.5 1 0;background:#3E8CF0"></span>
      <span style="flex:5.5 1 0;background:#5CAD69"></span>
      <span style="flex:3 1 0;background:#EB901D"></span>
      <span style="flex:8 1 0;background:#E53E3E"></span>
    </div>
    <div class="legend">
      <div><i style="background:#3E8CF0"></i><span><strong>體重過輕</strong><br><span class="num">BMI &lt; 18.5</span></span></div>
      <div><i style="background:#5CAD69"></i><span><strong>健康體位</strong><br><span class="num">18.5 ≤ BMI &lt; 24</span></span></div>
      <div><i style="background:#EB901D"></i><span><strong>過重</strong><br><span class="num">24 ≤ BMI &lt; 27</span></span></div>
      <div><i style="background:#E53E3E"></i><span><strong>肥胖</strong><br><span class="num">BMI ≥ 27</span></span></div>
    </div>
    <p class="formula">BMI ＝ 體重（公斤）÷ 身高（公尺）²</p>
  </div>
</div>
</section>
<script>
/* 嵌在 iframe 時，自動回報高度給外層頁面，避免出現捲軸；單獨開啟時不影響 */
(function(){
  if (window.parent === window) return;
  function send(){ window.parent.postMessage({ type: 'bmi-module-height', id: document.body.dataset.module, height: document.documentElement.scrollHeight }, '*'); }
  window.addEventListener('load', send);
  window.addEventListener('resize', send);
  if (window.ResizeObserver) new ResizeObserver(send).observe(document.body);
})();
</script>
</body>
</html>
