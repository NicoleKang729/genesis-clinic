<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>主視覺</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#3F3D56;--body:#5E5873;--muted:#6E6B7D;--orange:#EB901D;--orange-deep:#BB7217;--btn:#9A5204;--btn-dark:#6B3902;--pad-x:clamp(16px,5vw,24px)}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:transparent}
body{-webkit-font-smoothing:antialiased;font-family:'Noto Sans TC',-apple-system,BlinkMacSystemFont,'PingFang TC','Microsoft JhengHei',sans-serif;color:var(--body);line-height:1.7;-webkit-text-size-adjust:100%}
:focus-visible{outline:3px solid #3E8CF0;outline-offset:3px}

.hero .wrap{max-width:1200px;margin:0 auto;padding:clamp(40px,9vw,88px) var(--pad-x);display:grid;grid-template-columns:1fr;gap:clamp(24px,5vw,40px);align-items:center}
.hero-text{display:flex;flex-direction:column;gap:clamp(14px,3vw,20px);min-width:0}
.eyebrow{margin:0;display:inline-flex;align-items:center;gap:10px;font-size:clamp(13px,3.4vw,15px);font-weight:700;color:var(--orange-deep);letter-spacing:.12em}
.eyebrow::before{content:"";width:28px;height:3px;border-radius:3px;background:var(--orange)}
.hero h1{margin:0;font-size:clamp(30px,7.6vw,52px);line-height:1.25;font-weight:900;color:var(--ink)}
.hero-sub{margin:0;font-size:clamp(15px,4vw,18px);max-width:34em}

/* 按鈕 */
.actions{display:flex;flex-direction:column;gap:12px;width:100%}
.cta{display:flex;align-items:center;gap:14px;min-height:72px;padding:14px 18px 14px 20px;border-radius:18px;text-decoration:none;transition:transform .15s,box-shadow .15s,background .15s}
.cta .ic{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cta .tx{display:flex;flex-direction:column;flex:1;min-width:0;line-height:1.35}
.cta .t1{font-size:18px;font-weight:700;letter-spacing:.02em}
.cta .t2{font-size:14px;font-weight:500;margin-top:2px}
.cta .arrow{flex-shrink:0;transition:transform .15s}
.cta:hover .arrow{transform:translateX(4px)}
.cta-primary{background:var(--btn);color:#FFFFFF;box-shadow:0 5px 0 var(--btn-dark)}
.cta-primary:hover{transform:translateY(-2px);box-shadow:0 7px 0 var(--btn-dark);color:#FFFFFF;background:#8C4A03}
.cta-primary:active{transform:translateY(3px);box-shadow:0 2px 0 var(--btn-dark)}
.cta-primary .ic{background:rgba(255,255,255,.18)}
.cta-primary .t2{color:#FFFFFF;opacity:.92}
.cta-secondary{background:#FFFFFF;color:var(--ink);border:2px solid var(--orange)}
.cta-secondary:hover{border-color:var(--orange);background:#FFFBF5;color:var(--ink)}
.cta-secondary .ic{background:#FFF1DC}
.cta-secondary .t2{color:#5E5873}

/* 電腦版：文字靠左、按鈕在右 */
@media (min-width:900px){
  .hero .wrap{grid-template-columns:minmax(0,1fr) 340px;gap:64px}
}
@media (prefers-reduced-motion:reduce){
  .cta,.cta .arrow{transition:none}
  .cta:hover,.cta:active,.cta:hover .arrow{transform:none}
}
</style>
</head>
<body data-module="hero">
<section class="hero" id="top">
  <div class="wrap">
    <div class="hero-text">
      <p class="eyebrow">體重管理衛教專題</p>
      <h1>減重不只是外表，<br>是代謝健康的起點</h1>
      <p class="hero-sub">肥胖已被視為一種需要長期管理的慢性疾病。了解自己的體位、認識潛在風險，再和專業醫師一起擬定適合你的計畫。</p>
    </div>
    <div class="actions">
      <a class="cta cta-primary" href="https://hi.cofit.me/BcYta" target="_top">
        <span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="M9.5 15l2 2 3.5-3.5"/></svg></span>
        <span class="tx"><span class="t1">預約減重諮詢</span><span class="t2">專業醫師一對一評估</span></span>
        <svg class="arrow" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </a>
      <a class="cta cta-secondary" href="https://hi.cofit.me/Rmnsi" target="_top">
        <span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#BB7217" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 17a8.5 8.5 0 0 1 17 0"/><path d="M12 17l3.5-5"/><circle cx="12" cy="17" r="1.4" fill="#BB7217"/></svg></span>
        <span class="tx"><span class="t1">測測我的 BMI</span><span class="t2">1 分鐘快速檢測</span></span>
        <svg class="arrow" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </a>
    </div>
  </div>
</section>
<script>
/* 嵌在 iframe 時，自動回報高度給外層頁面，避免出現捲軸；單獨開啟時不影響 */
(function(){
  if (window.parent === window) return;
  function send(){ window.parent.postMessage({ type: 'bmi-module-height', id: document.body.dataset.module, height: document.documentElement.scrollHeight }, '*'); }
  window.addEventListener('load', send);
  window.addEventListener('resize', send);
  if (window.ResizeObserver) new ResizeObserver(send).observe(document.body);
})();
</script>
</body>
</html>
