<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!--
  查看初日醫師團隊 按鈕（嵌入 iframe 版）
  按下按鈕後，面板「原地取代」按鈕顯示（不往下長），
  所以 iframe 只需要面板本身的高度，頁面內也不會產生捲軸。

  後台 iframe 建議：
  <iframe src="https://nicolekang729.github.io/genesis-clinic/clinicdoctor5.html"
          width="100%" height="100%" frameborder="0"
          style="border:none;overflow:hidden;display:block;" scrolling="no"></iframe>
  PC 區塊高度 260、Mobile 區塊高度 300
-->
<style>
  *{box-sizing:border-box;}
  /* 嵌入 iframe：不產生任何捲軸，內容在 iframe 中垂直置中 */
  html,body{height:100%;overflow:hidden;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;
    text-align:center;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .widget{
    position:relative;
    display:flex;
    justify-content:center;
    width:100%;
    padding:12px;
  }
  /* 面板打開時把按鈕藏起來，面板直接佔用原本的位置 */
  .widget.open .pill-btn{display:none;}

  .pill-btn{
    display:inline-flex;
    align-items:center;
    gap:10px;
    background:#FEE9D8;
    color:#F37934;
    border:none;
    padding:22px 26px;
    border-radius:14px;
    font-size:19px;
    font-weight:700;
    cursor:pointer;
    transition:background .15s ease, transform .15s ease;
  }
  .pill-btn:hover{background:#fddcb8;transform:translateY(-1px);}
  .pill-btn svg{width:22px;height:22px;stroke:#F37934;flex:0 0 auto;}

  /* 面板：原地取代按鈕，不再浮在按鈕下方 */
  .panel{
    display:none;
    position:relative;
    width:440px;
    max-width:100%;
    background:#fff;
    border-radius:16px;
    box-shadow:0 6px 20px rgba(0,0,0,.14);
    padding:22px 16px 18px;
    z-index:10;
    text-align:center;
  }
  .panel.show{display:block;}

  .panel-close{
    position:absolute;top:12px;right:12px;
    background:none;border:none;
    font-size:20px;color:#8a8a8a;
    cursor:pointer;
    line-height:1;
  }
  .panel h3{margin:0;color:#F37934;font-size:20px;text-align:center;}
  .panel .sub{color:#8a8a8a;font-size:13px;margin:4px 0 12px;text-align:center;}
  #stepClinic .sub{margin-top:6px;}

  /* 返回按鈕釘在左上角，標題文字獨立置中 */
  .back-btn{
    position:absolute;
    top:14px;
    left:16px;
    background:none;
    border:none;
    color:#8a8a8a;
    font-size:14px;
    cursor:pointer;
    padding:0;
    white-space:nowrap;
  }
  .back-btn:hover{color:#F37934;}

  /* 橫向排列的選項格：4個一排，矮版長方形，分院/醫師都用同一種格子 */
  .option-list{
    display:flex;
    flex-flow:row wrap;
    justify-content:center;
    gap:10px;
    padding:2px;
  }
  .option-btn{
    background:#FEE9D8;
    color:#F37934;
    border:none;
    width:92px;
    height:44px;
    border-radius:10px;
    font-size:12px;
    font-weight:700;
    line-height:1.25;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    cursor:pointer;
    transition:background .15s ease, transform .15s ease;
    flex:0 0 auto;
    font-family:inherit;
  }
  .option-btn:hover{background:#fddcb8;transform:translateY(-1px);}

  /* 院所選擇列表：4個院所要擠在同一排，按鈕比醫師格窄一些、間距也縮小 */
  #clinicList{gap:8px;}
  #clinicList .option-btn{width:78px;font-size:11px;}
</style>
</head>
<body>

<div class="widget" id="widget">
  <button class="pill-btn" id="openTeamSearch">
    查看初日醫師團隊
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
  </button>

  <div class="panel" id="panel">
    <button class="panel-close" id="panelClose">&#10005;</button>

    <div id="stepClinic">
      <div class="sub">請直接選擇院所</div>
      <div class="option-list" id="clinicList"></div>
    </div>

    <div id="stepDoctor" style="display:none;">
      <button class="back-btn" id="backToClinic">&lsaquo; 返回</button>
      <h3 id="clinicTitle"></h3>
      <div class="sub">請選擇醫師</div>
      <div class="option-list" id="doctorList"></div>
    </div>
  </div>
</div>

<script>
(function(){
  const clinics = {
    taipei:   { name:'台北初日', doctors:['宋晏仁醫師','鄧雯心醫師','魏士航醫師','李唐越醫師','周建安醫師','許芷瑜醫師','陳威龍醫師','王律婷醫師'] },
    hsinchu:  { name:'新竹初日', doctors:['魏士航醫師','王律婷醫師','楊德仁醫師'] },
    taichung: { name:'台中初日', doctors:['李唐越醫師','宋晏仁醫師','魏士航醫師','莊承勳醫師'] },
    kaohsiung:{ name:'高雄初日', doctors:['李思賢醫師','范亞萱醫師','劉曜增醫師'] }
  };

  // 每位醫師對應到報名頁面上的名牌錨點
  const doctorLinks = {
    '宋晏仁醫師': 'https://events.cofit.me/genesis-16369#SD',
    '鄧雯心醫師': 'https://events.cofit.me/genesis-16369#SD',
    '李唐越醫師': 'https://events.cofit.me/genesis-16369#LW',
    '魏士航醫師': 'https://events.cofit.me/genesis-16369#LW',
    '周建安醫師': 'https://events.cofit.me/genesis-16369#CH',
    '許芷瑜醫師': 'https://events.cofit.me/genesis-16369#CH',
    '李思賢醫師': 'https://events.cofit.me/genesis-16369#LC',
    '陳威龍醫師': 'https://events.cofit.me/genesis-16369#LC',
    '劉曜增醫師': 'https://events.cofit.me/genesis-16369#LiuW',
    '王律婷醫師': 'https://events.cofit.me/genesis-16369#LiuW',
    '范亞萱醫師': 'https://events.cofit.me/genesis-16369#FY',
    '楊德仁醫師': 'https://events.cofit.me/genesis-16369#FY',
    '莊承勳醫師': 'https://events.cofit.me/genesis-16369#Zhuang'
  };

  const widget = document.getElementById('widget');
  const panel = document.getElementById('panel');
  const stepClinic = document.getElementById('stepClinic');
  const stepDoctor = document.getElementById('stepDoctor');
  const clinicList = document.getElementById('clinicList');
  const doctorList = document.getElementById('doctorList');
  const clinicTitle = document.getElementById('clinicTitle');

  document.getElementById('openTeamSearch').addEventListener('click', (e)=>{
    e.stopPropagation();
    panel.classList.add('show');
    widget.classList.add('open');
    showClinicStep();
  });
  document.getElementById('panelClose').addEventListener('click', closePanel);
  document.getElementById('backToClinic').addEventListener('click', showClinicStep);

  document.addEventListener('click', (e)=>{
    if(!widget.contains(e.target)) closePanel();
  });
  panel.addEventListener('click', (e)=> e.stopPropagation());

  function closePanel(){ panel.classList.remove('show'); widget.classList.remove('open'); }
  document.addEventListener('keydown', (e)=>{ if(e.key==='Escape') closePanel(); });

  function showClinicStep(){
    stepDoctor.style.display='none';
    stepClinic.style.display='block';
    clinicList.innerHTML='';
    Object.entries(clinics).forEach(([id,c])=>{
      const btn = document.createElement('button');
      btn.className='option-btn';
      btn.textContent=c.name;
      btn.addEventListener('click', ()=>showDoctorStep(id));
      clinicList.appendChild(btn);
    });
  }

  function showDoctorStep(clinicId){
    const c = clinics[clinicId];
    stepClinic.style.display='none';
    stepDoctor.style.display='block';
    clinicTitle.textContent = c.name;
    doctorList.innerHTML='';
    c.doctors.forEach(name=>{
      const btn = document.createElement('button');
      btn.className='option-btn';
      btn.textContent=name;
      btn.addEventListener('click', ()=>jumpToDoctor(name));
      doctorList.appendChild(btn);
    });
  }

  function jumpToDoctor(name){
    closePanel();
    const link = doctorLinks[name];
    if(link) window.open(link, '_blank');
  }
})();
</script>

</body>
</html>
