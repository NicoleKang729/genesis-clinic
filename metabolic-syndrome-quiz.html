<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>代謝症候群自我檢測｜五大指標你中幾個？</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF3E8; --paper:#FFFFFF; --ink:#3B2213; --muted:#8A644A; --line:#F3D3B8;
  --brand:#F07A1A; --brand-soft:#FFE4CC; --on-brand:#FFFFFF;
  --ok:#3B8C5F; --ok-soft:#E1F1E6; --warn:#D2361C; --warn-soft:#FCE0D8; --unk:#B8A496; --unk-soft:#F4ECE6;
  --focus:#C45400;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1E130B; --paper:#2A1A10; --ink:#F8E8DA; --muted:#C9A387; --line:#4A3020;
    --brand:#FF9A45; --brand-soft:#4A2A12; --on-brand:#2A1A10;
    --ok:#6CC795; --ok-soft:#1E3526; --warn:#FF6B4F; --warn-soft:#4A1F16; --unk:#957C6C; --unk-soft:#3A271B; --focus:#FFB070;
  }
}
:root[data-theme="dark"]{
  --bg:#1E130B; --paper:#2A1A10; --ink:#F8E8DA; --muted:#C9A387; --line:#4A3020;
  --brand:#FF9A45; --brand-soft:#4A2A12; --on-brand:#2A1A10;
  --ok:#6CC795; --ok-soft:#1E3526; --warn:#FF6B4F; --warn-soft:#4A1F16; --unk:#957C6C; --unk-soft:#3A271B; --focus:#FFB070;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.7;-webkit-font-smoothing:antialiased}
.num{font-family:"Bricolage Grotesque","Noto Sans TC",system-ui,sans-serif;font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto;padding:28px 20px 48px}

/* five-light indicator: the signature element */
.lights{display:flex;gap:10px;align-items:center;margin:0 0 28px}
.light{flex:1;height:10px;border-radius:5px;background:var(--line);transition:background .35s}
.light.yes{background:var(--warn)} .light.no{background:var(--ok)} .light.unk{background:var(--unk)}
.light.current{outline:2px solid var(--brand);outline-offset:3px}
.lights .cut{width:2px;height:22px;background:var(--brand);border-radius:1px;flex:none;opacity:.5}

h1{font-size:clamp(1.75rem,6vw,2.3rem);line-height:1.25;font-weight:900;margin:0 0 12px;letter-spacing:.01em}
.lede{color:var(--muted);margin:0 0 28px;font-size:1.02rem}
.card{background:var(--paper);border-radius:18px;padding:26px 22px;border:1px solid var(--line)}
.label{font-weight:700;margin:0 0 10px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font:inherit;cursor:pointer;color:inherit}
.opt{padding:14px 12px;border-radius:12px;border:1.5px solid var(--line);background:transparent;font-weight:700;font-size:1.05rem;transition:border-color .2s,background .2s}
.opt[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
.primary{width:100%;margin-top:22px;padding:15px;border-radius:12px;border:0;background:var(--brand);color:var(--on-brand);font-weight:700;font-size:1.05rem}
.cta{display:block;text-align:center;text-decoration:none;margin-top:30px}
.secondary{width:100%;margin-top:12px;padding:14px;border-radius:12px;border:1.5px solid var(--brand);background:transparent;color:var(--brand);font-weight:700;font-size:1.05rem}
.primary:disabled{opacity:.35;cursor:not-allowed}
.ghost{background:none;border:0;color:var(--muted);padding:8px 0;font-size:.95rem;text-decoration:underline;text-underline-offset:3px}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

/* question */
.qcount{color:var(--brand);font-weight:700;font-size:.95rem;margin:0 0 6px}
.qtitle{font-size:1.5rem;font-weight:900;margin:0 0 6px;line-height:1.35}
.crit{font-size:1.05rem;margin:0 0 4px}
.crit b{font-weight:700;color:var(--brand)}
.hint{color:var(--muted);font-size:.9rem;margin:0}
.measure{margin:22px 0 18px;padding:16px;border-radius:12px;background:var(--brand-soft)}
.measure p{margin:0 0 10px;font-size:.92rem;color:var(--muted)}
.fields{display:flex;flex-direction:column;gap:10px}
.field b{font-weight:700;font-size:.95rem;white-space:nowrap;min-width:3.5em}
.field{flex:1;min-width:130px;display:flex;align-items:center;gap:8px;background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:0 12px}
.field:focus-within{border-color:var(--brand)}
.field input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:600 1.2rem "Bricolage Grotesque","Noto Sans TC",sans-serif;padding:11px 0;outline:none}
.field span{color:var(--muted);font-size:.85rem;white-space:nowrap}
.autojudge{margin-top:10px;font-size:.92rem;font-weight:700;min-height:1.6em}
.autojudge.yes{color:var(--warn)} .autojudge.no{color:var(--ok)}
.choices{display:grid;gap:10px}
.choice{display:flex;align-items:center;gap:12px;text-align:left;padding:14px 16px;border-radius:12px;border:1.5px solid var(--line);background:transparent;font-size:1rem;font-weight:500}
.choice .dot{width:14px;height:14px;border-radius:50%;flex:none;border:2px solid currentColor}
.choice[data-v="yes"] .dot{color:var(--warn)} .choice[data-v="no"] .dot{color:var(--ok)} .choice[data-v="unk"] .dot{color:var(--unk)}
.choice[aria-pressed="true"][data-v="yes"]{border-color:var(--warn);background:var(--warn-soft)}
.choice[aria-pressed="true"][data-v="no"]{border-color:var(--ok);background:var(--ok-soft)}
.choice[aria-pressed="true"][data-v="unk"]{border-color:var(--unk);background:var(--unk-soft)}
.choice[aria-pressed="true"] .dot{background:currentColor}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.nav .primary{width:auto;flex:1;margin-left:16px}

/* result */
.score{display:flex;align-items:baseline;gap:6px;margin:0 0 4px}
.score .big{font-size:5.5rem;line-height:1;font-weight:800}
.score .of{font-size:1.4rem;color:var(--muted);font-weight:600}
.verdict{font-size:1.4rem;font-weight:900;margin:8px 0 8px;line-height:1.4}
.verdict.bad{color:var(--warn)} .verdict.mid{color:#C25A00} .verdict.good{color:var(--ok)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .verdict.mid{color:#FFA75A}}
.explain{margin:0 0 22px}
.list{list-style:none;padding:0;margin:0 0 6px}
.list li{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.tag{flex:none;font-size:.82rem;font-weight:700;padding:2px 10px;border-radius:999px;margin-top:2px}
.tag.yes{background:var(--warn-soft);color:var(--warn)} .tag.no{background:var(--ok-soft);color:var(--ok)} .tag.unk{background:var(--unk-soft);color:var(--muted)}
.list .t{font-weight:700} .list .s{color:var(--muted);font-size:.9rem}
h2{font-size:clamp(1.45rem,5.2vw,1.8rem);line-height:1.35;font-weight:900;margin:40px 0 8px;letter-spacing:.01em}
.bang{color:var(--warn);font-size:1.5em;font-weight:900;line-height:1;margin-left:2px;letter-spacing:-.15em;vertical-align:-.08em}
.sub{color:var(--muted);font-size:.92rem;margin:0 0 14px}
.risk{display:grid;grid-template-columns:4.5em 1fr 3.2em;gap:10px;align-items:center;margin:0 0 10px}
.risk .bar{height:14px;border-radius:7px;background:var(--line);overflow:hidden}
.risk .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--warn));border-radius:7px;width:0;transition:width .9s cubic-bezier(.2,.7,.2,1)}
.risk .x{font-weight:800;font-size:1.1rem;text-align:right}
.note{margin-top:26px;font-size:.85rem;color:var(--muted);line-height:1.7}
.hide{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="wrap">
  <div class="lights" id="lights" aria-hidden="true"></div>

  <!-- intro -->
  <section id="intro">
    <h1>健檢報告拿出來<br>三高二害你中幾個？</h1>
    <p class="lede">代謝症候群有跡可循！<br>透過5大指標，就能初步了解自己的代謝健康狀況。現在就花1分鐘，看看有哪些數值需要多留意！</p>
    <div class="card">
      <p class="label">你的生理性別</p>
      <div class="seg" role="group" aria-label="生理性別">
        <button class="opt" data-sex="m" aria-pressed="false">男性</button>
        <button class="opt" data-sex="f" aria-pressed="false">女性</button>
      </div>
      <p class="hint" style="margin-top:10px">腰圍與好膽固醇的標準男女不同。</p>
      <button class="primary" id="start" disabled>開始檢測</button>
    </div>
  </section>

  <!-- question -->
  <section id="quiz" class="hide">
    <div class="card">
      <p class="qcount">第 <span class="num" id="qi">1</span> 項，共 5 項</p>
      <p class="qtitle" id="qtitle"></p>
      <p class="crit" id="qcrit"></p>
      <p class="hint" id="qhint"></p>
      <div class="measure">
        <p>有健檢數值嗎？直接輸入，自動幫你判斷</p>
        <div class="fields" id="fields"></div>
        <div class="autojudge" id="auto" aria-live="polite"></div>
      </div>
      <div class="choices" role="group" aria-label="你的狀況">
        <button class="choice" data-v="yes" aria-pressed="false"><span class="dot"></span><span id="cyes">有，超過標準</span></button>
        <button class="choice" data-v="no" aria-pressed="false"><span class="dot"></span><span>沒有，在標準內</span></button>
        <button class="choice" data-v="unk" aria-pressed="false"><span class="dot"></span><span>不確定／沒量過</span></button>
      </div>
      <div class="nav">
        <button class="ghost" id="back">上一項</button>
        <button class="primary" id="next" disabled>下一項</button>
      </div>
    </div>
  </section>

  <!-- result -->
  <section id="result" class="hide">
    <div class="card">
      <p class="label" style="color:var(--muted);font-weight:500">你符合的指標</p>
      <div class="score"><span class="big num" id="rnum">0</span><span class="of num">/ 5</span></div>
      <p class="verdict" id="rverdict"></p>
      <p class="explain" id="rexplain"></p>
      <ul class="list" id="rlist"></ul>
    </div>

    <h2>不及早處理，這些疾病風險會上升<span class="bang" aria-hidden="true">！！</span></h2>
    <p class="sub">代謝症候群者與一般人相比的罹病風險</p>
    <div id="risks"></div>

    <a class="primary cta" href="https://hi.cofit.me/BcYta" target="_blank" rel="noopener">預約初診諮詢</a>
    <button class="secondary" id="restart">重新檢測</button>
    <p class="note">本檢測僅供自我評估參考，不能取代醫師診斷。判定標準參考國民健康署代謝症候群定義。若有任何一項超標，或有指標不確定，建議安排健康檢查並與醫師或營養師討論。</p>
  </section>
</main>

<script>
const Q = [
  { key:'bp', title:'血壓偏高',
    crit:()=> '收縮壓 <b>≥130</b> mmHg，或舒張壓 <b>≥85</b> mmHg',
    hint:'正在服用醫師開立的降血壓藥，也算符合。',
    fields:[{id:'sys',name:'收縮壓',unit:'mmHg'},{id:'dia',name:'舒張壓',unit:'mmHg'}],
    judge:v=>{ const s=v.sys, d=v.dia;
      if((s!=null&&s>=130)||(d!=null&&d>=85)) return 'yes';
      if(s!=null&&d!=null) return 'no'; return null; },
    short:'收縮壓≥130 或舒張壓≥85 mmHg' },
  { key:'glu', title:'空腹血糖偏高',
    crit:()=> '空腹血糖 <b>≥100</b> mg/dL',
    hint:'正在服用醫師開立的降血糖藥，也算符合。',
    fields:[{id:'glu',unit:'mg/dL'}],
    judge:v=> v.glu==null?null:(v.glu>=100?'yes':'no'),
    short:'空腹血糖≥100 mg/dL' },
  { key:'tg', title:'空腹三酸甘油酯偏高',
    crit:()=> '三酸甘油酯 <b>≥150</b> mg/dL',
    hint:'',
    fields:[{id:'tg',unit:'mg/dL'}],
    judge:v=> v.tg==null?null:(v.tg>=150?'yes':'no'),
    short:'三酸甘油酯≥150 mg/dL' },
  { key:'waist', title:'腹部肥胖',
    crit:s=> s==='m'?'男性腰圍 <b>≥90</b> 公分':'女性腰圍 <b>≥80</b> 公分',
    hint:'量法：站直、在肚臍高度水平繞一圈，自然吐氣後讀數。',
    fields:[{id:'waist',unit:'公分'}],
    judge:(v,s)=> v.waist==null?null:(v.waist>=(s==='m'?90:80)?'yes':'no'),
    short:s=> s==='m'?'腰圍≥90 公分':'腰圍≥80 公分' },
  { key:'hdl', title:'好膽固醇（HDL）偏低',
    crit:s=> s==='m'?'男性高密度脂蛋白膽固醇 <b>&lt;40</b> mg/dL':'女性高密度脂蛋白膽固醇 <b>&lt;50</b> mg/dL',
    hint:'這一項是「太低」才算，數字越高越好。',
    fields:[{id:'hdl',unit:'mg/dL'}],
    judge:(v,s)=> v.hdl==null?null:(v.hdl<(s==='m'?40:50)?'yes':'no'),
    short:s=> s==='m'?'HDL<40 mg/dL':'HDL<50 mg/dL' },
];
const RISKS=[['糖尿病',6],['高血壓',4],['高血脂',3],['心臟病',2],['腦中風',2]];

let sex=null, idx=0;
const ans=Array(5).fill(null), vals=Q.map(()=>({}));
const $=id=>document.getElementById(id);

function drawLights(current){
  const L=$('lights'); L.innerHTML='';
  ans.forEach((a,i)=>{
    if(i===3){const c=document.createElement('span');c.className='cut';c.title='第三項門檻';L.appendChild(c)}
    const d=document.createElement('span');
    d.className='light'+(a?' '+a:'')+(i===current?' current':'');
    L.appendChild(d);
  });
}

function show(id){['intro','quiz','result'].forEach(s=>$(s).classList.toggle('hide',s!==id));window.scrollTo({top:0})}

document.querySelectorAll('[data-sex]').forEach(b=>b.onclick=()=>{
  sex=b.dataset.sex;
  document.querySelectorAll('[data-sex]').forEach(x=>x.setAttribute('aria-pressed',x===b));
  $('start').disabled=false;
});
$('start').onclick=()=>{idx=0;renderQ();show('quiz')};

function renderQ(){
  const q=Q[idx];
  $('qi').textContent=idx+1;
  $('qtitle').textContent=q.title;
  $('qcrit').innerHTML=q.crit(sex);
  $('qhint').textContent=q.hint; $('qhint').style.display=q.hint?'':'none';
  $('cyes').textContent= q.key==='hdl'?'有，低於標準':'有，超過標準';
  const F=$('fields'); F.innerHTML='';
  q.fields.forEach(f=>{
    const w=document.createElement('label'); w.className='field';
    w.innerHTML=`${f.name?`<b>${f.name}</b>`:''}<input type="number" inputmode="decimal" min="0" step="any" id="f_${f.id}" aria-label="${(f.name||'')+' '+f.unit}"><span>${f.unit}</span>`;
    F.appendChild(w);
    const inp=w.querySelector('input');
    if(vals[idx][f.id]!=null) inp.value=vals[idx][f.id];
    inp.addEventListener('input',()=>{
      const n=parseFloat(inp.value);
      vals[idx][f.id]=isNaN(n)?null:n;
      const j=q.judge(vals[idx],sex);
      if(j){setAns(j);}
      renderAuto();
    });
  });
  renderAuto(); syncChoices();
  $('back').style.visibility='visible';
  $('next').textContent= idx===4?'看結果':'下一項';
  drawLights(idx);
}

function renderAuto(){
  const j=Q[idx].judge(vals[idx],sex), a=$('auto');
  a.className='autojudge'+(j?' '+j:'');
  a.textContent= j==='yes'?'依你的數值：符合這項指標':j==='no'?'依你的數值：在標準範圍內':'';
}
function setAns(v){ans[idx]=v;syncChoices();drawLights(idx)}
function syncChoices(){
  document.querySelectorAll('.choice').forEach(c=>c.setAttribute('aria-pressed',c.dataset.v===ans[idx]));
  $('next').disabled=!ans[idx];
}
document.querySelectorAll('.choice').forEach(c=>c.onclick=()=>setAns(c.dataset.v));
$('back').onclick=()=>{ if(idx===0){show('intro');drawLights(-1)} else {idx--;renderQ()} };
$('next').onclick=()=>{ if(idx<4){idx++;renderQ()} else renderResult() };

function renderResult(){
  const yes=ans.filter(a=>a==='yes').length, unk=ans.filter(a=>a==='unk').length;
  $('rnum').textContent=yes;
  const v=$('rverdict'), e=$('rexplain');
  if(yes>=3){
    v.className='verdict bad'; v.textContent='已達代謝症候群判定標準';
    e.textContent='五項中符合三項以上，就屬於代謝症候群。這是身體在提醒你，現在調整飲食、活動與作息，多數指標都有機會改善。建議盡快與醫師討論。';
  }else if(yes>=1){
    v.className='verdict mid'; v.textContent='已出現危險因子，還來得及';
    e.textContent= (yes+unk>=3)
      ? `目前符合 ${yes} 項，另有 ${unk} 項不確定。只要再多一項就達到代謝症候群標準，建議盡快把不確定的項目量清楚。`
      : `目前符合 ${yes} 項，尚未達到代謝症候群標準，但已經是警訊。趁現在調整生活習慣，最容易逆轉。`;
  }else{
    v.className='verdict good';
    v.textContent= unk? '目前沒有確定超標的項目':'五項都在標準內，繼續保持';
    e.textContent= unk>=3
      ? `有 ${unk} 項不確定，還無法完整判斷。建議安排一次健康檢查，把數字補齊。`
      : unk? `有 ${unk} 項不確定，建議下次健檢一起確認。` : '維持規律運動與均衡飲食，每年定期健檢追蹤就好。';
  }
  const label={yes:'符合',no:'正常',unk:'不確定'};
  $('rlist').innerHTML=Q.map((q,i)=>{
    const s=typeof q.short==='function'?q.short(sex):q.short;
    return `<li><span class="tag ${ans[i]}">${label[ans[i]]}</span><div><div class="t">${q.title}</div><div class="s">${s}</div></div></li>`;
  }).join('');
  $('risks').innerHTML=RISKS.map(([n,x])=>`<div class="risk"><span>${n}</span><span class="bar"><i data-w="${x/6*100}"></i></span><span class="x num">${x}倍</span></div>`).join('');
  drawLights(-1); show('result');
  requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelectorAll('.risk i').forEach(i=>i.style.width=i.dataset.w+'%')));
}
$('restart').onclick=()=>{ans.fill(null);vals.forEach(o=>{for(const k in o)delete o[k]});idx=0;show('intro');drawLights(-1)};

drawLights(-1);
</script>
</body>
</html>
